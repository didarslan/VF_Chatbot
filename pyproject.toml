[project]
name = "vodafone-agentic-assistant"
version = "0.1.0"
description = "Vodafone TR agentic assistant: 5G Q&A + device catalog + order workflow"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.6",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "html2text>=2024.2.26",
  "tenacity>=8.2",
  "langchain>=0.3.0",
  "langchain-openai>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-milvus>=0.1.0",
  "pymilvus>=2.4.0",
  "chromadb>=0.5.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]